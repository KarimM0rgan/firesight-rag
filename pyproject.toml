[project]
name = "firesight-rag"
version = "0.1.0"
description = "Hybrid RAG over NFIRS fire-department data: text-to-SQL + vector retrieval with a measured evaluation harness."
readme = "README.md"
requires-python = ">=3.11,<3.13"
license = { text = "MIT" }
authors = [{ name = "Karim E. Morgan" }]

dependencies = [
    "duckdb>=1.1",
    "sqlglot>=25.0",
    "python-dotenv>=1.0",
    "pydantic>=2.9",
]

[project.optional-dependencies]
# Installed from M2 onward; kept separate so M0/M1 stay light.
rag = [
    "chromadb>=0.5",
    "sentence-transformers>=3.0",
]
app = ["streamlit>=1.39", "plotly>=5.24"]
llm = ["anthropic>=0.40", "openai>=1.54"]

[dependency-groups]
dev = [
    "pytest>=8.3",
    "ruff>=0.7",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/firesight"]

[tool.ruff]
line-length = 100
src = ["src", "tests", "scripts"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]
# SIM300 flags `CONSTANT == value` as a Yoda condition; in tests that pin a
# module constant the constant belongs on the left.
ignore = ["SIM300"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
addopts = "-q"
